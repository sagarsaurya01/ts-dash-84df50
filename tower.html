<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Tower</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F3F5F4; --card:#fff; --ink:#0F1A24; --muted:#4A5A66; --line:#D9E0E3;
    --teal:#0B6E7F; --teal-d:#084F5C;
    --red-fg:#B42318; --red-bg:#FDECEA; --red-bd:#F5C2BD;
    --amb-fg:#7A4E00; --amb-bg:#FFF4D6; --amb-bd:#EBD38F;
    --grn-fg:#1E6B3A; --grn-bg:#E3F3E8; --grn-bd:#B9DEC5;
    --nd-fg:#5c6b73; --nd-bg:#eef1f2; --nd-bd:#d9e0e3;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#13161a; --card:#1c2128; --ink:#e7eaec; --muted:#9aa4ab; --line:#2b323a;
    --teal:#4bb8cc; --teal-d:#7fd0df;
    --red-bg:#3a1d16; --red-bd:#5c2a20; --amb-bg:#352a12; --amb-bd:#574620;
    --grn-bg:#15301f; --grn-bd:#245236; --nd-fg:#8a949b; --nd-bg:#232a31; --nd-bd:#2b323a; color-scheme:dark;
  }}
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;white-space:nowrap}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px clamp(16px,3vw,40px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600}
  .brand b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--teal);color:#fff;font-size:13px}
  .brand .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:400}
  nav{display:flex;gap:2px;flex-wrap:wrap}
  nav button{border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
  nav button:hover{background:#e7ecee;color:var(--ink)}
  @media (prefers-color-scheme:dark){nav button:hover{background:#242b32}}
  nav button[aria-current="true"]{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
  nav button .nd{font-size:9px;color:var(--nd-fg);margin-left:4px}
  .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  select{font:inherit;font-size:.85rem;padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:.05em}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:p 1.8s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
  main{padding:18px clamp(16px,3vw,40px) 40px;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  h2{margin:0;font-size:15px;font-weight:600}
  .sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .hint{font-size:12px;color:var(--muted)}
  .brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:8px}
  .brief .line{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid var(--line)}
  .brief .line .word{flex:0 0 78px;text-align:center;font-weight:500}
  .brief .line .dept{flex:0 0 auto}
  .brief .line .txt{flex:1 1 auto;min-width:0;font-size:13.5px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
  .dcard{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
  .dcard .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .dcard .ttl{font-size:14px;font-weight:600;line-height:1.35}
  .dcard .why{font-size:12.5px;color:var(--muted)}
  .dcard button.act{min-height:34px;padding:0 12px;border-radius:6px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .dcard button.act.primary{border:0;background:var(--teal);color:#fff}
  .whybtn{margin-left:auto;border:0;background:transparent;color:var(--teal);font-size:12px;font-weight:600;cursor:pointer}
  .cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
  .goals{flex:1 1 320px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .goal{display:flex;flex-direction:column;gap:5px;padding:9px 0;border-top:1px solid var(--line)}
  .goal:first-of-type{border-top:0}
  .goal .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .goal .mid{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .bar{height:6px;border-radius:3px;background:#eef1f2;overflow:hidden}
  @media (prefers-color-scheme:dark){.bar{background:#2b323a}}
  .bar i{display:block;height:6px;border-radius:3px}
  .decide{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:10px}
  .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .num{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
  .num .v{font-size:20px;font-weight:500}
  .num .n{font-size:12px;color:var(--muted)}
  .seg{display:flex;background:#E4EAEC;border-radius:8px;padding:3px;gap:3px}
  @media (prefers-color-scheme:dark){.seg{background:#242b32}}
  .seg button{min-height:32px;padding:0 14px;border:0;border-radius:6px;font:inherit;font-size:13px;background:transparent;color:var(--muted);cursor:pointer}
  .seg button[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:600}
  .nd-chip{background:var(--nd-bg);color:var(--nd-fg);border:1px dashed var(--nd-bd)}
  .nd .v{color:var(--nd-fg)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
  th{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  td.r,th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .nd-board{background:var(--nd-bg);border:1px dashed var(--nd-bd);border-radius:12px;padding:28px;text-align:center;color:var(--nd-fg)}
  .nd-board b{color:var(--ink)}
  .err{background:var(--red-bg);color:var(--red-fg);border:1px solid var(--red-bd);border-radius:10px;padding:12px;font-size:.86rem}
  .foot{font-family:var(--mono);font-size:11px;color:var(--muted)}
  [hidden]{display:none!important}
</style>
<meta name="robots" content="noindex,nofollow">
</head>
<body>
<div id="pwgate" style="position:fixed;inset:0;z-index:99999;background:#0f6e5c;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif">
  <form id="pwform" style="background:#fff;padding:28px 26px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.3);width:280px;text-align:center">
    <div style="font-size:15px;font-weight:700;color:#1c1f26;margin-bottom:4px">Protected dashboard</div>
    <div style="font-size:12px;color:#6b6f78;margin-bottom:14px">Enter the access password</div>
    <input id="pwin" type="password" autofocus style="width:100%;padding:9px 10px;border:1px solid #ccc;border-radius:7px;font-size:14px;box-sizing:border-box">
    <div id="pwerr" style="color:#b5541f;font-size:11.5px;height:14px;margin:6px 0 0"></div>
    <button type="submit" style="margin-top:10px;width:100%;padding:9px;border:0;border-radius:7px;background:#0f6e5c;color:#fff;font-size:14px;font-weight:600;cursor:pointer">Open</button>
  </form>
</div>
<script>
(function(){
  var PW="tallybook@26";
  try{ if(sessionStorage.getItem("tsauth")==="1"){var g=document.getElementById("pwgate"); if(g) g.remove(); return;} }catch(e){}
  function wire(){
    var f=document.getElementById("pwform"); if(!f) return;
    f.addEventListener("submit",function(ev){
      ev.preventDefault();
      var v=document.getElementById("pwin").value;
      if(v==="tallybook@26"){ try{sessionStorage.setItem("tsauth","1");}catch(e){} var g=document.getElementById("pwgate"); if(g) g.remove(); }
      else { document.getElementById("pwerr").textContent="Wrong password"; }
    });
  }
  if(document.readyState!=="loading") wire(); else document.addEventListener("DOMContentLoaded",wire);
})();
</script>

<header>
  <div class="brand"><b>CT</b><span id="coname">Control Tower</span><span class="sub" id="synced"></span></div>
  <nav id="tabs"></nav>
  <div class="right"><span class="live"><span class="dot"></span>Live</span><select id="company"></select></div>
</header>
<main>
  <div id="err"></div>
  <div id="board"></div>
  <div class="foot" id="stamp"></div>
</main>

<script>
const BASE="https://shjqgktvdszjfpbxdnvb.supabase.co/rest/v1/rpc";
const KEY="sb_publishable_elxnVCVa5_YYPYlmkCdodg_Kdixelr1";
const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
let CID="52209906-443a-4db6-ae42-3475c69c2866";
let TAB="Main", PERIOD="daily";
const inr=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const inrL=n=>'₹'+((n||0)/100000).toFixed(2)+' L';
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function rpc(fn,body){const r=await fetch(BASE+'/'+fn,{method:'POST',headers:H,body:JSON.stringify(body)});if(!r.ok)throw new Error(fn+' '+r.status);return r.json();}

// tabs: [id, label, live?]  live=false => "No data" board
const TABS=[["Main","Control Tower",true],["Accounts","Accounting & Collections",true],
  ["Enquiry","Enquiry to Order",false],["MTD","Make to Deliver",false],
  ["Admin","Admin & Compliance",false],["Phone","Phone brief",true]];

let DATA={};
function ymd(d){return d.toISOString().slice(0,10);}
function windows(){
  const t=new Date();
  const today=ymd(t);
  const w=new Date(t); w.setDate(w.getDate()-6);
  const m=new Date(t.getFullYear(),t.getMonth(),1);
  return {daily:[today,today],weekly:[ymd(w),today],monthly:[ymd(m),today]};
}
function dso(o){let w=0,b=0;(o||[]).forEach(x=>{if(x.balance>0){w+=x.balance*(x.age_days||0);b+=x.balance;}});return b>0?Math.round(w/b):0;}
function ageT(a){const t={a:0,b:0,c:0,d:0,over:0,tot:0};(a||[]).forEach(r=>{t.a+=+r.age_0_30||0;t.b+=+r.age_31_60||0;t.c+=+r.age_61_90||0;t.d+=+r.age_over_90||0;t.over+=+r.overdue||0;t.tot+=+r.total||0;});return t;}

// --- status helpers ---
const PAL={red:'red',amber:'amb',green:'grn'};
function line(st,dept,txt){const p=PAL[st];
  return `<div class="line" style="background:var(--${p}-bg);border-color:var(--${p}-bd)">
    <span class="tag word" style="background:var(--card);color:var(--${p}-fg)">${st==='red'?'Off track':st==='amber'?'At risk':'On track'}</span>
    <span class="tag dept" style="background:rgba(255,255,255,.55);color:var(--muted)">${esc(dept)}</span>
    <span class="txt">${txt}</span></div>`;}
function ndLine(dept,what){
  return `<div class="line" style="background:var(--nd-bg);border-color:var(--nd-bd);border-style:dashed">
    <span class="tag word nd-chip">No data</span>
    <span class="tag dept" style="background:var(--card);color:var(--muted)">${esc(dept)}</span>
    <span class="txt" style="color:var(--nd-fg)">${esc(what)} — not in Tally</span></div>`;}

function boardMain(){
  const d=DATA.dash||{}, a=DATA.ageing||[], t=ageT(a), days=dso(DATA.outstanding);
  const topOver=a.filter(r=>r.overdue>0).slice(0,4);
  // Today in brief
  let brief='';
  brief+= days>30 ? line('red','Accounts',`Collections running <b>${days} days</b> vs 30-day terms`)
                  : line('green','Accounts',`Collections within terms (${days} days)`);
  brief+= t.over>0 ? line('red','Accounts',`<b>${inr(t.over)}</b> overdue · ${a.filter(r=>r.overdue>0).length} parties`)
                   : line('green','Accounts','Nothing overdue');
  brief+= (d.cash||0)<0 ? line('amber','Accounts',`Cash in books is negative: <b>${inr(d.cash)}</b>`)
                        : line('green','Accounts',`Cash in hand <b>${inr(d.cash)}</b>`);
  brief+= ndLine('Factory','Dispatches, production, on-time %');
  brief+= ndLine('Sales','Quotes, orders, enquiries, leads');
  brief+= ndLine('Admin','Statutory filings & compliance status');

  // Decide now — from real overdue parties
  let cards='';
  topOver.forEach((r,i)=>{
    cards+=`<div class="dcard" style="background:var(--red-bg);border-color:var(--red-bd)">
      <div class="row"><span class="tag" style="background:var(--card);color:var(--red-fg);font-weight:500">Overdue</span>
        <span class="tag" style="background:rgba(255,255,255,.55);color:var(--muted)">Accounts</span>
        <span class="tag" style="background:rgba(255,255,255,.55);color:var(--ink)">${inr(r.overdue)}</span></div>
      <span class="ttl">${esc(r.ledger_name)} is overdue ${inr(r.overdue)}</span>
      <span class="why">Oldest bill ${r.oldest_bill_days||0} days · ${r.open_bills||0} open bill(s).</span>
      <div class="row"><button class="act primary">Follow up</button><button class="act">Snooze</button></div>
    </div>`;
  });
  cards+=`<div class="dcard" style="background:var(--nd-bg);border:1px dashed var(--nd-bd)">
    <div class="row"><span class="tag nd-chip">No data</span><span class="tag" style="background:var(--card);color:var(--muted)">Sales / Factory</span></div>
    <span class="ttl" style="color:var(--nd-fg)">Order-approval & production decisions</span>
    <span class="why">Needs a sales / production feed — not in Tally.</span></div>`;

  // Goals
  const goals=[
    ['Debtor days', days+' days', 'target under 30', Math.min(100,Math.round(30/Math.max(days,1)*100)), days>45?'red':days>30?'amb':'grn', true],
    ['Overdue to clear', inr(t.over), t.over>0?'target ₹0':'clear', t.over>0?20:100, t.over>0?'red':'grn', true],
    ['Receivables', inr(d.receivables), a.length+' parties', 60, 'amb', true],
    ['November orders', 'No data', 'needs sales feed', 0, 'nd', false],
    ['Metres this week', 'No data', 'needs factory feed', 0, 'nd', false],
    ['On-time dispatch', 'No data', 'needs factory feed', 0, 'nd', false],
    ['Statutory filings', 'No data', 'needs compliance feed', 0, 'nd', false]
  ];
  let goalsH='';
  goals.forEach(([lab,val,tgt,pct,st,ok])=>{
    const c = st==='nd' ? 'nd' : st;
    goalsH+=`<div class="goal ${ok?'':'nd'}">
      <div class="top"><span style="font-weight:600;font-size:13px">${lab}</span>
        <span class="tag ${ok?'':'nd-chip'}" style="${ok?`background:var(--${c}-bg);color:var(--${c}-fg)`:''}">${ok?(st==='grn'?'On track':st==='amb'?'At risk':'Off track'):'No data'}</span></div>
      <div class="mid"><span class="mono" style="font-size:15px">${val}</span><span style="font-size:12px;color:var(--muted)">${tgt}</span></div>
      <div class="bar"><i style="width:${pct}%;background:${ok?`var(--${c}-fg)`:'var(--nd-bd)'}"></i></div></div>`;
  });

  // Key numbers (period)
  const p=DATA.period&&DATA.period[PERIOD]||{};
  const periodNums=[
    ['Sales', inr(p.sales), 'invoiced', true],
    ['Collected', inr(p.receipts), 'receipts', true],
    ['Paid out', inr(p.payments), 'payments', true],
    ['Vouchers', (p.vouchers||0).toLocaleString('en-IN'), 'entries', true],
    ['Outstanding', inr(d.receivables), a.length+' parties', true],
    ['Overdue 60+', inr(t.c+t.d), 'past 60 days', true],
    ['Metres produced', 'No data', 'needs factory feed', false],
    ['Enquiries / leads', 'No data', 'needs sales feed', false]
  ];
  let numsH='';
  periodNums.forEach(([lab,val,note,ok])=>{
    numsH+=`<div class="num ${ok?'':'nd'}" style="${ok?'':'border-style:dashed'}">
      <div class="row" style="display:flex;justify-content:space-between"><span class="lbl">${lab}</span>${ok?'':'<span class="tag nd-chip">No data</span>'}</div>
      <span class="mono v">${val}</span><span class="n">${note}</span></div>`;
  });
  const segs=['daily','weekly','monthly'].map(k=>`<button role="tab" aria-selected="${k===PERIOD}" data-p="${k}">${k==='daily'?'Today':k==='weekly'?'This week':'This month'}</button>`).join('');

  return `
  <section><div class="sec-head"><h2>Today in brief</h2><span class="hint">Live accounting · operational feeds pending</span></div>
    <div class="brief">${brief}</div></section>
  <section class="cols">
    <div class="decide"><div class="sec-head"><h2>Decide now</h2>
      <span><span class="tag" style="background:var(--red-bg);color:var(--red-fg)">${topOver.length} overdue</span></span></div>
      <div class="cards">${cards}</div></div>
    <aside class="goals"><h2 style="margin-bottom:6px">Goals</h2>${goalsH}</aside>
  </section>
  <section><div class="sec-head"><h2>Key numbers</h2><div class="seg" id="seg">${segs}</div></div>
    <div class="nums">${numsH}</div></section>`;
}

function boardAccounts(){
  const a=DATA.ageing||[],o=DATA.outstanding||[],t=ageT(a);
  return `<section class="panel"><h2>Party ageing</h2>
    <table><thead><tr><th>Party</th><th class="r">Total</th><th class="r">0-30</th><th class="r">31-60</th><th class="r">61-90</th><th class="r">90+</th><th class="r">Overdue</th></tr></thead><tbody>
    ${a.slice(0,30).map(r=>`<tr><td>${esc(r.ledger_name)}</td><td class="r">${inr(r.total)}</td><td class="r">${inr(r.age_0_30)}</td><td class="r">${inr(r.age_31_60)}</td><td class="r">${inr(r.age_61_90)}</td><td class="r">${inr(r.age_over_90)}</td><td class="r">${inr(r.overdue)}</td></tr>`).join('')||'<tr><td colspan=7 style="color:var(--muted)">No open receivables</td></tr>'}
    </tbody></table></section>
  <section class="panel" style="margin-top:16px"><h2>Open bills (most overdue first)</h2>
    <table><thead><tr><th>Party</th><th>Bill</th><th>Due</th><th class="r">Days overdue</th><th class="r">Amount</th></tr></thead><tbody>
    ${o.slice(0,25).map(b=>`<tr><td>${esc(b.ledger_name)}</td><td>${esc(b.bill_name)||'—'}</td><td>${esc(b.due_date)||'—'}</td><td class="r">${b.days_overdue||0}</td><td class="r">${inr(b.balance)}</td></tr>`).join('')||'<tr><td colspan=5 style="color:var(--muted)">No open bills</td></tr>'}
    </tbody></table></section>`;
}
function boardPhone(){
  const d=DATA.dash||{},t=ageT(DATA.ageing),days=dso(DATA.outstanding),p=DATA.period&&DATA.period.monthly||{};
  const big=(l,v,c)=>`<div class="num" style="margin-bottom:10px"><span class="lbl">${l}</span><span class="mono v" style="font-size:24px;${c||''}">${v}</span></div>`;
  return `<div style="max-width:380px;margin:0 auto">
    ${big('Receivables',inr(d.receivables))}
    ${big('Overdue',inr(t.over),'color:var(--red-fg)')}
    ${big('Collection days',days+' vs 30')}
    ${big('Collected this month',inr(p.receipts))}
    ${big('Cash in hand',inr(d.cash))}
  </div>`;
}
function ndBoard(label,needs){
  return `<div class="nd-board"><div style="font-size:16px;margin-bottom:8px"><b>${esc(label)}</b></div>
    <div>No data — this isn't in Tally.</div>
    <div style="margin-top:8px;font-size:13px">Needs a feed from: ${esc(needs)}.</div></div>`;
}
const ND={Enquiry:['Enquiry to Order','a sales / CRM system (quotes, orders, enquiries, leads)'],
          MTD:['Make to Deliver','a production / dispatch system (metres, jobs, on-time %)'],
          Admin:['Admin & Compliance','a compliance tracker (filings, statutory due dates)']};

function draw(){
  const b=document.getElementById('board');
  if(TAB==='Main')b.innerHTML=boardMain();
  else if(TAB==='Accounts')b.innerHTML=boardAccounts();
  else if(TAB==='Phone')b.innerHTML=boardPhone();
  else if(ND[TAB])b.innerHTML=ndBoard(ND[TAB][0],ND[TAB][1]);
  // wire period toggle
  const seg=document.getElementById('seg');
  if(seg)seg.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{PERIOD=btn.dataset.p;draw();});
}
function drawTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([id,label,live])=>
    `<button data-id="${id}" aria-current="${id===TAB}">${label}${live?'':'<span class="nd">●</span>'}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.id;try{location.hash=TAB}catch(e){}; drawTabs(); draw();});
}
async function loadCompanies(){
  try{
    const list=await rpc('tally_company_list',{});
    if(!list.length)return;
    let saved=null;try{saved=localStorage.getItem('ct_cid')}catch(e){}
    if(saved&&list.some(c=>c.id===saved))CID=saved; else if(!list.some(c=>c.id===CID))CID=list[0].id;
    const sel=document.getElementById('company');
    sel.innerHTML=list.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
    sel.value=CID;
    sel.onchange=()=>{CID=sel.value;try{localStorage.setItem('ct_cid',CID)}catch(e){}; load();};
  }catch(e){}
}
async function load(){
  try{
    const W=windows();
    const [dash,ageing,outstanding,pd,pw,pm]=await Promise.all([
      rpc('tally_dashboard',{p_company_id:CID}),
      rpc('tally_ageing',{p_company_id:CID,p_limit:100}),
      rpc('tally_outstanding',{p_company_id:CID,p_limit:200}),
      rpc('tally_period',{p_company_id:CID,p_from:W.daily[0],p_to:W.daily[1]}),
      rpc('tally_period',{p_company_id:CID,p_from:W.weekly[0],p_to:W.weekly[1]}),
      rpc('tally_period',{p_company_id:CID,p_from:W.monthly[0],p_to:W.monthly[1]})
    ]);
    DATA={dash,ageing,outstanding,period:{daily:pd,weekly:pw,monthly:pm}};
    document.getElementById('err').innerHTML='';
    document.getElementById('coname').textContent=(dash&&dash.company)||'Control Tower';
    document.getElementById('synced').textContent=' · '+new Date().toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' · Tally synced';
    draw();
    document.getElementById('stamp').textContent='Live from Supabase (Tally sync) · accounting is live · operational feeds not connected';
  }catch(e){document.getElementById('err').innerHTML='<div class="err">Could not load: '+e.message+'</div>';}
}
TAB=(location.hash||'#Main').slice(1); if(!TABS.some(t=>t[0]===TAB))TAB='Main';
drawTabs();
(async()=>{await loadCompanies(); load();})();
setInterval(load,60000);
</script>
</body></html>
