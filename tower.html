<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Control Tower — Live Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F3F5F4; --ink:#0F1A24; --teal:#0B6E7F; --teal-d:#084F5C; --teal-tint:#E9F3F5; --teal-tint-b:#C4DDE2;
    --card:#FFFFFF; --line:#D9E0E3; --lbl:#4A5A66; --row:#E6EBED;
    --alert-bg:#FBEDE3; --alert-b:#EBC4A6; --alert-l:#7A3508; --alert-v:#8A3C09;
    --nd-bg:#F0F2F2; --nd-b:#DBE1E2;
    --body:'Instrument Sans',system-ui,-apple-system,Segoe UI,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  a{color:var(--teal);text-decoration:none}a:hover{color:var(--teal-d)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lbl)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-sizing:border-box;min-width:0}
  button{font-family:inherit;cursor:pointer}

  /* top bar */
  .top{background:#10222B;color:#eaf2f3;display:flex;align-items:center;gap:12px;padding:10px clamp(14px,3vw,28px);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
  .logo{width:22px;height:22px;border-radius:6px;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
  .top select{margin-left:auto;font-family:var(--body);font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid #2b3b43;background:#172d36;color:#eaf2f3}
  /* dept nav */
  nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px clamp(14px,3vw,28px);background:#fff;border-bottom:1px solid var(--line)}
  nav.tabs button{white-space:nowrap;border:0;background:transparent;color:#45555f;font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:8px;min-height:40px}
  nav.tabs button.on{background:#EAF2F3;color:var(--teal-d)}
  nav.tabs button.nd{color:#9aa6ac}
  nav.tabs button.nd::after{content:'•';margin-left:6px;color:#b9c2c6}

  .page{padding:24px clamp(16px,3vw,48px) 56px}
  .inner{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

  .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
  .head .l{display:flex;flex-direction:column;gap:8px;flex:1 1 560px;min-width:0}
  h1.hl{margin:0;font-size:clamp(22px,3.4vw,32px);line-height:1.2;font-weight:600;text-wrap:balance}
  .toggle{display:flex;background:#E4EAEC;border-radius:10px;padding:4px;gap:4px}
  .toggle button{min-height:44px;padding:0 18px;border:0;border-radius:7px;font-size:15px;background:transparent;color:#33434F}
  .toggle button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,26,36,.12)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .tile{padding:18px;display:flex;flex-direction:column;gap:8px}
  .tile .v{font-size:24px;font-weight:500}
  .tile .n{font-size:13px;color:var(--lbl)}
  .tile.alert{background:var(--alert-bg);border-color:var(--alert-b)}
  .tile.alert .lbl{color:var(--alert-l)} .tile.alert .v{color:var(--alert-v)} .tile.alert .n{color:var(--alert-l)}
  .tile.nd{background:var(--nd-bg);border:1px dashed var(--nd-b)}
  .tile.nd .v{color:#8b969c;font-size:14px;font-weight:600} .tile.nd .n{color:#9aa6ac}

  .lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
  .lc{padding:22px;display:flex;flex-direction:column}
  .lc h2{margin:0;font-size:18px;font-weight:600}
  .lc .csub{font-size:13px;color:var(--lbl);padding:4px 0 10px}
  .lrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--row)}
  .lrow .m{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
  .lrow .m .a{font-weight:600;font-size:15px}
  .lrow .m .b{font-size:13px;color:var(--lbl)}
  .lrow .val{flex:0 0 auto;font-size:14px;text-align:right;color:#33434F}
  .lrow .val.alert{color:var(--alert-v);font-weight:500}
  .lrow .val.hot{color:var(--teal);font-weight:600}
  .lc.nd{background:var(--nd-bg);border-style:dashed}
  .ndbox{color:#8b969c;font-size:14px;padding:14px 0}
  .points{padding:22px;display:flex;flex-direction:column;gap:12px;background:var(--teal-tint);border-color:var(--teal-tint-b)}
  .points .ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .points .ph h2{margin:0;font-size:18px;font-weight:600}
  .pt{display:flex;gap:12px;align-items:flex-start}
  .pt .num{flex:0 0 26px;height:26px;border-radius:13px;background:#fff;color:var(--teal-d);display:flex;align-items:center;justify-content:center;font-size:12px}
  .pt .tx{font-size:15px;line-height:1.5}
  .foot{margin:0;font-size:12px;color:var(--lbl)}
  .back{align-self:flex-start;display:flex;align-items:center;gap:6px;min-height:40px;font-weight:600;font-size:14px}
  .err{background:#fde8e0;color:#8a2b0c;border-radius:10px;padding:12px;font-size:14px}
</style>
</head>
<body>
<div id="pwgate" style="position:fixed;inset:0;z-index:99999;background:#0B6E7F;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif">
  <form id="pwform" style="background:#fff;padding:28px 26px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.3);width:280px;text-align:center">
    <div style="font-size:15px;font-weight:700;color:#0F1A24;margin-bottom:4px">Control Tower</div>
    <div style="font-size:12px;color:#4A5A66;margin-bottom:14px">Enter the access password</div>
    <input id="pwin" type="password" autofocus style="width:100%;padding:9px 10px;border:1px solid #ccc;border-radius:7px;font-size:14px;box-sizing:border-box">
    <div id="pwerr" style="color:#8A3C09;font-size:11.5px;height:14px;margin:6px 0 0"></div>
    <button type="submit" style="margin-top:10px;width:100%;padding:9px;border:0;border-radius:7px;background:#0B6E7F;color:#fff;font-size:14px;font-weight:600">Open</button>
  </form>
</div>
<script>
(function(){
  try{ if(sessionStorage.getItem("tsauth")==="1"){var g=document.getElementById("pwgate"); if(g) g.remove(); return;} }catch(e){}
  function wire(){var f=document.getElementById("pwform"); if(!f) return;
    f.addEventListener("submit",function(ev){ev.preventDefault();
      if(document.getElementById("pwin").value==="tallybook@26"){try{sessionStorage.setItem("tsauth","1");}catch(e){}var g=document.getElementById("pwgate");if(g)g.remove();}
      else{document.getElementById("pwerr").textContent="Wrong password";}});}
  if(document.readyState!=="loading") wire(); else document.addEventListener("DOMContentLoaded",wire);
})();
</script>

<div class="top">
  <div class="brand"><span class="logo">₹</span><span id="brand">Control Tower</span></div>
  <select id="company" aria-label="Book"></select>
</div>
<nav class="tabs" id="tabs"></nav>

<div class="page"><div class="inner" id="root">
  <div class="lbl">Loading live books…</div>
</div></div>

<script>
const BASE="https://shjqgktvdszjfpbxdnvb.supabase.co/rest/v1/rpc";
const KEY="sb_publishable_elxnVCVa5_YYPYlmkCdodg_Kdixelr1";
const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
let CID="806a7176-ec76-4d83-a1e0-30987a46677a", BOOK="", PERIOD="daily";
let DASH=null, AGE=[], OUT=[], PER={};

const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inr=n=>'₹'+Math.round(Math.abs(n||0)).toLocaleString('en-IN');
const inrL=n=>'₹'+(Math.abs(n||0)/100000).toFixed(2)+' lakh';
const ymd=d=>d.toISOString().slice(0,10);
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}

async function rpc(fn,body){const r=await fetch(BASE+'/'+fn,{method:'POST',headers:H,body:JSON.stringify(body||{})});
  if(!r.ok) throw new Error(fn+' HTTP '+r.status); return r.json();}

const DEPTS=[
  ['tower','Control Tower',false],
  ['enquiry','Enquiry to Order',true],
  ['accounts','Accounting and Collections',false],
  ['make','Make to Deliver',true],
  ['admin','Admin & Compliance',true],
  ['whycash','Why cash was weak',false],
  ['phone','Phone brief',false],
  ['add','Add an entry',true]
];
let DEPT='accounts';

function renderTabs(){
  document.getElementById('tabs').innerHTML = DEPTS.map(([k,label,nd])=>
    `<button class="${k===DEPT?'on':''} ${nd?'nd':''}" onclick="pickDept('${k}')">${label}</button>`).join('');
}
window.pickDept=k=>{DEPT=k;renderTabs();render();};
window.pickPeriod=p=>{PERIOD=p;render();};

async function loadCompanies(){
  try{
    const list=await rpc('tally_company_list',{});
    if(!list.length) return;
    let saved=null; try{saved=localStorage.getItem('tallysync_cid');}catch(e){}
    CID=(saved&&list.some(c=>c.id===saved))?saved:list[0].id;
    const sel=document.getElementById('company');
    sel.innerHTML=list.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    sel.value=CID;
    sel.onchange=()=>{CID=sel.value;try{localStorage.setItem('tallysync_cid',CID);}catch(e){}loadBook();};
  }catch(e){}
}

async function loadBook(){
  document.getElementById('root').innerHTML='<div class="lbl">Loading live books…</div>';
  try{
    const today=new Date();
    const win={
      daily:[ymd(today),ymd(today)],
      weekly:[ymd(addDays(today,-6)),ymd(today)],
      monthly:[ymd(addDays(today,-29)),ymd(today)]
    };
    const q90=[ymd(addDays(today,-89)),ymd(today)];
    const [dash,age,out,pd,pw,pm,p90]=await Promise.all([
      rpc('tally_dashboard',{p_company_id:CID}),
      rpc('tally_ageing',{p_company_id:CID,p_limit:200}),
      rpc('tally_outstanding',{p_company_id:CID,p_limit:200}),
      rpc('tally_period',{p_company_id:CID,p_from:win.daily[0],p_to:win.daily[1]}),
      rpc('tally_period',{p_company_id:CID,p_from:win.weekly[0],p_to:win.weekly[1]}),
      rpc('tally_period',{p_company_id:CID,p_from:win.monthly[0],p_to:win.monthly[1]}),
      rpc('tally_period',{p_company_id:CID,p_from:q90[0],p_to:q90[1]})
    ]);
    DASH=dash; AGE=age||[]; OUT=out||[]; PER={daily:pd,weekly:pw,monthly:pm,q90:p90,win};
    BOOK=dash.company||'Book';
    document.getElementById('brand').textContent=BOOK+' · Control Tower';
    render();
  }catch(e){
    document.getElementById('root').innerHTML='<div class="err">Could not reach Supabase: '+esc(e.message)+'</div>';
  }
}

// ---- derived accounting numbers ----
function derive(){
  const sum=(a,f)=>a.reduce((s,x)=>s+(+x[f]||0),0);
  const REC=AGE.filter(a=>(+a.total||0)>0);              // receivables only (drop advances)
  const todayStr=ymd(new Date());
  const overdue60=sum(REC,'age_61_90')+sum(REC,'age_over_90');
  const totalOut=sum(REC,'total');                        // single source = bill-wise ageing
  const parties=REC.length;
  const dueToday=OUT.filter(b=>b.due_date===todayStr&&(+b.balance||0)>0);
  const dueTodaySum=dueToday.reduce((s,b)=>s+(+b.balance||0),0);
  const next30=addDays(new Date(),30), nowD=new Date();
  const comingIn=OUT.filter(b=>b.due_date&&(+b.balance||0)>0&&new Date(b.due_date)>=nowD&&new Date(b.due_date)<=next30)
                    .reduce((s,b)=>s+(+b.balance||0),0);
  const overdueParties=REC.filter(a=>(+a.overdue||0)>0).sort((a,b)=>b.overdue-a.overdue);
  const openBills=OUT.filter(b=>(+b.days_overdue||0)>0&&(+b.balance||0)>0).slice(0,6);
  const buckets=[
    ['0–30 days',sum(REC,'age_0_30')],['31–60 days',sum(REC,'age_31_60')],
    ['61–90 days',sum(REC,'age_61_90')],['Over 90 days',sum(REC,'age_over_90')]
  ];
  const bigBal=[...REC].sort((a,b)=>b.total-a.total).slice(0,6);
  const sales90=Math.abs(+(PER.q90&&PER.q90.sales)||0);
  const dso=sales90>0?Math.round(totalOut/(sales90/90)):null;
  return {overdue60,totalOut,parties,dueToday,dueTodaySum,comingIn,overdueParties,openBills,buckets,bigBal,dso,sales90};
}

const tile=(label,val,note,kind)=>{
  if(kind==='nd') return `<div class="card tile nd"><span class="lbl">${label}</span><span class="v">No data</span><span class="n">not in Tally</span></div>`;
  return `<div class="card tile ${kind==='alert'?'alert':''}"><span class="lbl">${label}</span><span class="v mono">${val}</span><span class="n">${note||''}</span></div>`;
};
function listCard(title,sub,rows){
  const body=rows.length?rows.map(r=>
    `<div class="lrow"><div class="m"><span class="a">${esc(r.main)}</span><span class="b">${esc(r.sub)}</span></div>`+
    `<span class="val mono ${r.kind||''}">${esc(r.val)}</span>`+(r.action?`<button type="button" style="flex:0 0 auto;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:13px;font-weight:600">${esc(r.action)}</button>`:'')+`</div>`).join('')
    :'<div class="ndbox">Nothing here right now.</div>';
  return `<div class="card lc"><h2>${esc(title)}</h2><span class="csub">${esc(sub)}</span>${body}</div>`;
}
const ndCard=(title,why)=>`<div class="card lc nd"><h2>${esc(title)}</h2><span class="csub">Needs a system outside Tally</span><div class="ndbox">No data – not in Tally. ${esc(why)}</div></div>`;
function pointsCard(pts){
  return `<section class="card points"><div class="ph"><h2>Talking points for this review</h2><span class="lbl" style="color:var(--teal-d)">Built live from the numbers above</span></div>`+
    pts.map((t,i)=>`<div class="pt"><span class="num mono">${i+1}</span><span class="tx">${esc(t)}</span></div>`).join('')+`</section>`;
}

function accountsBoard(){
  const D=derive();
  const when={daily:'today',weekly:'last 7 days',monthly:'this month'}[PERIOD];
  const w=PER.win[PERIOD];
  const coll=Math.abs(+(PER[PERIOD]&&PER[PERIOD].receipts)||0);
  const nP=PER[PERIOD]?(PER[PERIOD].vouchers||0):0;
  let headline, tiles, cards, pts;

  if(PERIOD==='daily'){
    headline = D.dueToday.length
      ? `${D.dueToday.length} bill${D.dueToday.length>1?'s':''} fall due today — ₹${(D.dueTodaySum/100000).toFixed(1)} lakh. ${D.overdueParties.length} parties are already overdue.`
      : `${D.overdueParties.length} parties are overdue. ₹${(D.overdue60/100000).toFixed(1)} lakh of it is past 60 days.`;
    tiles=[
      tile('Cash collected',inr(coll),nP+' entries today'),
      tile('Due today',inr(D.dueTodaySum),D.dueToday.length+' bills',D.dueTodaySum>0?'alert':''),
      tile('Reminders sent','','','nd'),
      tile('Receipts to check','','','nd'),
      tile('Red-flag orders','','','nd')
    ];
    cards=[
      listCard('Overdue parties — chase first','Largest overdue balance first',
        D.overdueParties.slice(0,6).map(a=>({main:a.ledger_name,sub:inr(a.total)+' total · oldest '+(a.oldest_bill_days||0)+' days',val:inr(a.overdue),kind:'alert',action:'Call'}))),
      listCard('Open bills — most overdue','Bill-wise, from Tally',
        D.openBills.map(b=>({main:b.ledger_name,sub:(b.bill_name||'On account')+' · due '+(b.due_date||'—'),val:(b.days_overdue||0)+' days',kind:'alert'})))
    ];
    pts=[];
    if(D.overdueParties[0]) pts.push(`${D.overdueParties[0].ledger_name} owes ${inr(D.overdueParties[0].overdue)} overdue; oldest bill is ${D.overdueParties[0].oldest_bill_days||0} days old.`);
    pts.push(`${inr(D.overdue60)} across ${D.overdueParties.length} parties is overdue past 60 days.`);
    pts.push('Reminders, receipt-matching and new-order red-flags need the CRM/bank system — not in Tally yet.');
  }
  else if(PERIOD==='weekly'){
    headline=`${inr(coll)} collected this week. ${inr(D.overdue60)} is overdue past 60 days.`;
    tiles=[
      tile('Collected',inr(coll),nP+' entries'),
      tile('Overdue past 60 days',inr(D.overdue60),D.overdueParties.length+' parties',D.overdue60>0?'alert':''),
      tile('Coming in · next 30 days',inr(D.comingIn),'from bill due-dates'),
      tile('Cash out · next 30 days','','','nd'),
      tile('Escalated','','','nd')
    ];
    cards=[
      listCard('Overdue past 60 days','Largest first',
        D.overdueParties.slice(0,6).map(a=>({main:a.ledger_name,sub:inr(a.total)+' total',val:(a.oldest_bill_days||0)+' days',kind:'alert',action:'Call'}))),
      listCard('Open bills — most overdue','Bill-wise, from Tally',
        D.openBills.map(b=>({main:b.ledger_name,sub:(b.bill_name||'On account'),val:inr(b.balance),kind:'alert'})))
    ];
    pts=[`${inr(coll)} came in over the last 7 days across ${nP} entries.`,
         `${inr(D.overdue60)} is overdue past 60 days — chase the largest balances first.`,
         'Cash-out forecast and escalation tracking need the payables/CRM system — not in Tally.'];
  }
  else{ // monthly
    headline = D.dso!=null
      ? `Collections run about ${D.dso} days against your credit terms.`
      : `${inr(D.totalOut)} is outstanding across ${D.parties} parties.`;
    tiles=[
      tile('Total outstanding',inr(D.totalOut),D.parties+' parties'),
      tile('Debtor days',D.dso!=null?String(D.dso):'',D.dso!=null?'rough, from last 90 days’ sales':'', D.dso!=null?(D.dso>45?'alert':''):'nd'),
      tile('Overdue past 60 days',inr(D.overdue60),D.overdueParties.length+' parties',D.overdue60>0?'alert':''),
      tile('Collected · last 30 days',inr(Math.abs(+(PER.monthly.receipts)||0)),(PER.monthly.vouchers||0)+' entries'),
      tile('Material cost %','','','nd')
    ];
    cards=[
      listCard('Ageing buckets','Whole book, from Tally',
        D.buckets.map(b=>({main:b[0],sub:'',val:inr(b[1]),kind:b[0].indexOf('90')>-1?'alert':''}))),
      listCard('Biggest balances','Top parties by total due',
        D.bigBal.map(a=>({main:a.ledger_name,sub:(a.open_bills||0)+' open bills',val:inr(a.total)})))
    ];
    pts=[`${inr(D.totalOut)} is outstanding across ${D.parties} parties`+(D.dso!=null?`, about ${D.dso} debtor-days.`:'.'),
         `${inr(D.overdue60)} has aged past 60 days.`,
         'Cost-head %, grades and material cost need the costing/CRM data — not in Tally.'];
  }

  return `
    <a class="back" href="#" onclick="pickDept('tower');return false;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>All departments</a>
    <div class="head">
      <div class="l">
        <span class="lbl" style="color:var(--teal)">Accounting and Collections · ${when}</span>
        <h1 class="hl">${esc(headline)}</h1>
        <span class="mono" style="font-size:12px;color:var(--lbl)">Tally · live · window ${w[0]} to ${w[1]}</span>
      </div>
      <div class="toggle" role="tablist">
        ${['daily','weekly','monthly'].map(p=>`<button role="tab" class="${p===PERIOD?'on':''}" onclick="pickPeriod('${p}')">${p[0].toUpperCase()+p.slice(1)}</button>`).join('')}
      </div>
    </div>
    <section class="tiles">${tiles.join('')}</section>
    <section class="lists">${cards.join('')}</section>
    ${pointsCard(pts)}
    <p class="foot">Live from Tally via Supabase · amounts in ₹ · tiles marked “No data” need a system outside Tally (CRM, bank-matching, costing).</p>`;
}

function towerBoard(){
  const D=derive();
  const neg=(+DASH.cash||0)<0;
  return `
    <div class="head"><div class="l">
      <span class="lbl" style="color:var(--teal)">Control Tower · ${esc(BOOK)}</span>
      <h1 class="hl">${inr(D.totalOut)} outstanding · ${inr(D.overdue60)} overdue past 60 days.</h1>
      <span class="mono" style="font-size:12px;color:var(--lbl)">Pick a department below</span>
    </div></div>
    <section class="tiles">
      ${tile('Receivables',inr(D.totalOut),D.parties+' parties')}
      ${tile('Overdue 60+ days',inr(D.overdue60),D.overdueParties.length+' parties',D.overdue60>0?'alert':'')}
      ${tile('Cash in hand',inr(DASH.cash),'as per books',neg?'alert':'')}
      ${tile('Card dues',inrL(DASH.card_dues),(DASH.cards||[]).length+' cards')}
      ${tile('Tracked',(DASH.ledger_count||0)+' ledgers',(DASH.voucher_count||0).toLocaleString('en-IN')+' vouchers')}
    </section>
    <section class="lists">
      <div class="card lc" onclick="pickDept('accounts')" style="cursor:pointer">
        <h2>Accounting and Collections →</h2><span class="csub">Live: collections, ageing, overdue, open bills</span>
        ${D.overdueParties.slice(0,4).map(a=>`<div class="lrow"><div class="m"><span class="a">${esc(a.ledger_name)}</span><span class="b">${inr(a.total)} total</span></div><span class="val mono alert">${inr(a.overdue)} overdue</span></div>`).join('')}
      </div>
      <div class="card lc" onclick="pickDept('whycash')" style="cursor:pointer">
        <h2>Why cash was weak →</h2><span class="csub">Live: where the money went</span>
        ${(DASH.expenses||[]).slice(0,4).map(e=>`<div class="lrow"><div class="m"><span class="a">${esc(e.name)}</span></div><span class="val mono">${inr(e.amt)}</span></div>`).join('')}
      </div>
    </section>
    <section class="tiles">
      ${ndCard('Enquiry to Order','Needs the CRM / IndiaMART / WhatsApp lead data.')}
      ${ndCard('Make to Deliver','Needs the production & dispatch system.')}
    </section>`;
}

    <div class="head"><div class="l">
      <span class="lbl" style="color:var(--teal)">Why cash was weak · ${esc(BOOK)}</span>

      <span class="mono" style="font-size:12px;color:var(--lbl)">Tally · live</span>
    </div></div>
    <section class="tiles">
      ${tile('Stuck in receivables',inr(D.totalOut),D.parties+' parties',D.totalOut>0?'alert':'')}
      ${tile('Cash in hand',inr(DASH.cash),'as per books',(+DASH.cash||0)<0?'alert':'')}
      ${tile('Overdue 60+ days',inr(D.overdue60),'the slow money',D.overdue60>0?'alert':'')}
    </section>
    <section class="lists">
      ${listCard('Where the money went','Biggest expense heads, from Tally',(DASH.expenses||[]).slice(0,8).map(e=>({main:e.name,sub:'',val:inr(e.amt)})))}
      ${listCard('Who owes you','Biggest balances',D.bigBal.map(a=>({main:a.ledger_name,sub:(a.open_bills||0)+' bills',val:inr(a.total),kind:'alert'})))}
    </section>
    ${pointsCard([`${inr(D.totalOut)} is tied up in unpaid bills — that is the main drag on cash.`,`${inr(D.overdue60)} has aged past 60 days.`,'Collect the oldest, biggest balances first to free cash.'])}`;
}

function phoneBoard(){
  const D=derive();
  return `
    <a class="back" href="#" onclick="pickDept('tower');return false;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>All departments</a>
    <div class="head"><div class="l">
      <span class="lbl" style="color:var(--teal)">Phone brief · ${esc(BOOK)}</span>
      <h1 class="hl">One-screen summary</h1>
    </div></div>
    <section class="tiles" style="grid-template-columns:1fr">
      ${tile('Receivables',inr(D.totalOut),D.parties+' parties')}
      ${tile('Overdue 60+ days',inr(D.overdue60),D.overdueParties.length+' parties',D.overdue60>0?'alert':'')}
      ${tile('Cash in hand',inr(DASH.cash),'as per books',(+DASH.cash||0)<0?'alert':'')}

function ndBoard(name,why){
  return `
    <a class="back" href="#" onclick="pickDept('tower');return false;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>All departments</a>
    <div class="head"><div class="l">
      <span class="lbl" style="color:var(--lbl)">${esc(name)} · ${esc(BOOK)}</span>
      <h1 class="hl">No data — not in Tally.</h1>
      <span class="mono" style="font-size:12px;color:var(--lbl)">${esc(why)}</span>
    </div></div>
    <div class="card lc nd"><div class="ndbox">This board needs a system outside Tally. Once ${esc(name)} data is connected, it will fill in here automatically — the layout is ready.</div></div>`;
}

function render(){
  if(!DASH){return;}
  renderTabs();
  let html;
  if(DEPT==='accounts') html=accountsBoard();
  else if(DEPT==='tower') html=towerBoard();
  else if(DEPT==='whycash') html=whyCashBoard();
  else if(DEPT==='phone') html=phoneBoard();
  else if(DEPT==='enquiry') html=ndBoard('Enquiry to Order','Needs the CRM / IndiaMART / WhatsApp lead data.');
  else if(DEPT==='make') html=ndBoard('Make to Deliver','Needs the production and dispatch system.');
  else if(DEPT==='admin') html=ndBoard('Admin & Compliance','Needs the filing/compliance calendar.');
  else if(DEPT==='add') html=ndBoard('Add an entry','This writes data back — the current setup is read-only.');
  else html=accountsBoard();
  document.getElementById('root').innerHTML=html;
}

(async()=>{renderTabs();await loadCompanies();await loadBook();})();
setInterval(loadBook,120000);
</script>
</body></html>
